name: Tests

on:
  pull_request:
  push:
    branches:
      - main

env:
  POSTGRES_DB: cm_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: password

jobs:
  linter:
    name: linter
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Run linter
        run: bundle exec rubocop

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Run Tests
        env:
          RAILS_ENV: test
          PGHOST: localhost
        run: |
          bundle exec rails db:create
          bundle exec rails db:migrate
          bundle exec rake
